name: Curated gallery checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved entries and privacy-policy location
        run: node gallery/validate.mjs
      - name: Syntax check gallery JavaScript
        run: node --check gallery/gallery.js
